# Packs the two NuGet packages and publishes them to nuget.org when a v* tag is pushed.
# Trusted Publishing: NuGet/login trades the GitHub OIDC token for a one-hour key, so the
# repository stores no API key. The nuget.org policy must name this repository and publish.yml.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # nuget.config lists ./packages, which is not in git; restore fails when it is missing.
      - run: mkdir -p packages

      - run: dotnet pack sdk/Orikago.Sdk/Orikago.Sdk.csproj -c Release -o artifacts

      - run: dotnet pack templates/Orikago.Templates.csproj -c Release -o artifacts

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: orlys

      # The shell expands the glob in order, so the SDK goes up before the templates that use it.
      - name: NuGet push
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
